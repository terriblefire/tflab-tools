[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tflab-tools"
version = "0.1.0"
description = "Stephen Leary's hardware/FPGA bench tools (bin2mif, bin2vrlg, mkzorro, hp1660 logic-analyser interface)"
readme = "README.md"
license = "BSD-2-Clause"
authors = [{ name = "Stephen Leary", email = "sleary@vavi.co.uk" }]
requires-python = ">=3.9"
keywords = ["fpga", "verilog", "amiga", "zorro", "logic-analyser", "hp1660", "mif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
gpib = ["pyvisa>=1.13", "pyvisa-py>=0.7", "pyusb>=1.2"]
eagle = [
    "lxml>=4.9",
    "eagle2svg @ git+https://github.com/terriblefire/eagle2svg@master",
    "svglib>=1.5",
    "reportlab>=3.6",
]

[project.scripts]
bin2mif       = "tflab.bin2mif:main"
bin2vrlg      = "tflab.bin2vrlg:main"
mkzorro       = "tflab.mkzorro:main"
hp1661-vcd    = "tflab.hp1661_vcd:main"
eagle-netlist = "tflab.eagle_netlist:main"
eagle-pcf     = "tflab.eagle_pcf:main"
eagle-pdf     = "tflab.eagle_pdf:main"

[tool.hatch.metadata]
# Required because the [eagle] extra references a git URL (eagle2svg fork).
# This means tflab-tools cannot be published to PyPI as-is; either drop
# the direct reference or vendor the fork before doing so.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tflab"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tflab",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
